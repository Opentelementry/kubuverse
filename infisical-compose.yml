services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: infisical_password
      POSTGRES_DB: infisical
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.0
    volumes:
      - redis_data:/data

  infisical:
    image: infisical/infisical:latest
    ports:
      - "8080:8080"
    environment:
      - ENCRYPTION_KEY=f40c9178624764ad85a6830b37ce239a # Use openssl rand -hex 32
      - AUTH_SECRET=q6LRi7c717a3DQ8JUxlWYkZpMhG4+RHLoFUVt3Bvo2U=
      - REDIS_URL=redis://redis:6379
      - DB_CONNECTION_URI=postgresql://infisical:infisical_password@db:5432/infisical
      - SITE_URL=http://your-server-ip:8080
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
